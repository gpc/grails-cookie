def docProject = provider {
    project(":${project.name - 'root'}docs")
}
def pluginProject = provider {
    project(":${project.name - '-root'}")
}

tasks.register('cleanDocs', Delete) {
    description = 'Deletes the documentation output'
    group = 'documentation'

    delete(rootProject.layout.projectDirectory.dir('build/docs'))
}

// Gradle 9 forbids resolving another project's configurations outside that
// project's lock, which a root-project Groovydoc task cannot avoid: its
// 'groovyClasspath' is a detached configuration of the plugin project and would
// be resolved while the root task executes. So the plugin project generates its
// own API docs (config.compile carries the shared Groovydoc conventions) and the
// root build only collects the output.
def upstreamGroovydoc = pluginProject.flatMap {
    it.tasks.named('groovydoc', Groovydoc)
} as Provider<Groovydoc>

tasks.register('aggregateGroovyApiDoc', Copy) {
    description = 'Collects the plugin project\'s Groovy API Documentation under build/docs/gapi'
    group = 'documentation'

    dependsOn(tasks.named('cleanDocs'))
    dependsOn(upstreamGroovydoc)

    from(upstreamGroovydoc.map { it.destinationDir })
    into(rootProject.layout.buildDirectory.dir('docs/gapi'))
}

tasks.register('docs') {
    description = 'Generates the documentation'
    group = 'documentation'

    dependsOn(
            'aggregateGroovyApiDoc',
            docProject.get().tasks.named('asciidoctor')
    )
    finalizedBy(
            'copyAsciiDoctorDocs'
    )
}

tasks.register('copyAsciiDoctorDocs', Copy) {
    group = 'documentation'

    from(docProject.flatMap { it.layout.buildDirectory })
    into(rootProject.layout.buildDirectory)
    include('docs/**')
    includeEmptyDirs = false

}
